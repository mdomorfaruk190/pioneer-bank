<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-area">
        <h1 class="text-center">Welcome to Pioneer Bank</h1>
        <div class="submit-area">
            <h4>Login</h4>
            <input type="text" name="" id="" placeholder="Email" class="form-control"> <br>
            <input type="password" name="" id="" placeholder="Password" class="form-control"> <br>
            <button id="login" class="btn btn-success">Enter</button>
        </div>
    </div>
    <div id="transaction-area">
        <div class="row">
            <div class="col-md-4">
                <div class="deposit status">
                    <h5>Deposit</h5>
                <h2>$<span id="currentDeposit">00</span></h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="withdraw status">
                    <h5>Withdraw</h5>
                <h2>$ <span id="currentWithdraw">00</span></h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="balance status">
                    <h5>Balance</h5>
                <h2>$ <span id="balanceAmount">1240</span></h2>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="submit-area">
                    <h4>Deposit</h4>
                <input type="text" name="" id="depositAmount" placeholder="$ amount you want to deposit" class="form-control">
                <br>
                <button class="btn btn-success" id="addDeposit">Deposit</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="submit-area">
                    <h4>Withdraw</h4>
                <input type="text" name="" placeholder="$ amount you want to withdraw" id="withdrawAmount" class="form-control">
                <br>
                <button class="btn btn-success" id="addWithdraw">Withdraw</button>
                <button class="btn btn-success" id="addWithdraw2">Withdraw4</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        
        // login button event handler
        const loginBtn = document.getElementById('login');
        loginBtn.addEventListener('click', function(){
            const loginArea = document.getElementById('login-area');
            const transactionArea = document.getElementById('transaction-area');
            loginArea.style.display = 'none';
            transactionArea.style.display = 'block';
        });

        // deposit button event handler
        const depositBtn = document.getElementById('addDeposit');

        depositBtn.addEventListener('click', function (){
            const depositNumber = getInputNumber('depositAmount');
            // update deposit
            updateSpanText("currentDeposit", depositNumber);

            // update balance
            updateSpanText("balanceAmount", depositNumber)

            // remove form input field
            document.getElementById('depositAmount').value = '';

        });

        // withdraw button event handler
        const withdrawBtn = document.getElementById('addWithdraw');
        withdrawBtn.addEventListener('click', function(){
            const withdrawAmount = getInputNumber('withdrawAmount');

            updateSpanText('currentWithdraw', withdrawAmount);

            updateSpanText('balanceAmount', -1 * withdrawAmount)
        });

        function getInputNumber(id){
            const amount = document.getElementById(id).value;
            const amountNumber = parseFloat(amount);
            return amountNumber;
        }


        function  updateSpanText(id, depositNumber){
            const current = document.getElementById(id).innerText;
            const currentNumber = parseFloat(current);
            const totalAmount = currentNumber + depositNumber;
            document.getElementById(id).innerText = totalAmount;

        }
    </script>
</body>
</html>
